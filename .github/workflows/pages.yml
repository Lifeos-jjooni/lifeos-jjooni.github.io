name: Deploy LIFE OS static site
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build reviewed public-only source
        env:
          LIFEOS_ENABLE_GOOGLE: ${{ vars.LIFEOS_ENABLE_GOOGLE }}
          LIFEOS_ENROLLMENT: ${{ vars.LIFEOS_ENROLLMENT }}
          LIFEOS_ORIGIN: ${{ vars.LIFEOS_ORIGIN }}
          LIFEOS_PAGES_OWNER: ${{ github.repository_owner }}
          LIFEOS_PRODUCTION_BRANCH: main
          LIFEOS_GOOGLE_CLIENT_ID: ${{ vars.LIFEOS_GOOGLE_CLIENT_ID }}
          LIFEOS_OWNER_SUB_SHA256: ${{ vars.LIFEOS_OWNER_SUB_SHA256 }}
        run: node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
      contents: read
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
