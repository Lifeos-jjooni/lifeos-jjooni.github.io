name: Deploy LIFE OS static site
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build reviewed public-only source
        env:
          LIFEOS_ENABLE_GOOGLE: 'true'
          LIFEOS_ENROLLMENT: 'false'
          LIFEOS_ORIGIN: 'https://lifeos-jjooni.github.io'
          LIFEOS_PAGES_OWNER: ${{ github.repository_owner }}
          LIFEOS_PRODUCTION_BRANCH: main
          LIFEOS_GOOGLE_CLIENT_ID: '302183135622-i5s4ll3c8pa3dc29sk7uu1atqg7upmbd.apps.googleusercontent.com'
          LIFEOS_OWNER_SUB_SHA256: '9ac36d07345ee295d89419ce266cea5341e112ddcf3db25282178d5e6dfd6fd7'
        run: |
          node build.mjs
          mkdir -p dist/connect-v112
          find dist -maxdepth 1 -type f -exec cp {} dist/connect-v112/ \;
          node --input-type=module -e "import('./dist/connect-v112/config.mjs').then(({googleConfig:c})=>{if(!c.enabled||c.enrollment||!c.ownerSubSha256)process.exit(1);console.log('OWNER_CONNECTION_CONFIG_VERIFIED')})"
      - name: Include isolated reviewed synthetic V2 preview
        run: |
          mkdir -p dist/preview-v2
          cp preview-v2/*.mjs preview-v2/*.html preview-v2/*.css preview-v2/*.svg preview-v2/*.js preview-v2/*.webmanifest dist/preview-v2/
          node --input-type=module -e "import('./dist/preview-v2/config.mjs').then(({googleConfig:c})=>{if(c.enabled||c.enrollment||c.clientId||c.ownerSubSha256)process.exit(1);console.log('SYNTHETIC_PREVIEW_ONLY')})"
      - name: Include parallel V2 owner pilot
        run: |
          mkdir -p dist/v2-pilot
          cp pilot-v2/*.mjs pilot-v2/*.html pilot-v2/*.css pilot-v2/*.svg pilot-v2/*.js pilot-v2/*.webmanifest dist/v2-pilot/
          cp dist/config.mjs dist/v2-pilot/config.mjs
          node --input-type=module -e "import('./dist/v2-pilot/config.mjs').then(({googleConfig:c})=>{if(!c.enabled||c.enrollment||!c.ownerSubSha256||c.origin!=='https://lifeos-jjooni.github.io')process.exit(1);console.log('PILOT_OWNER_CONFIG_VERIFIED')})"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
      contents: read
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
